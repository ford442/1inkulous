name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - run: npm ci
      - run: npm run build:wasm
      # Every `test:*` script in package.json, so a new one is picked up without
      # touching this file. Includes `test:abi`, which fails when core_abi.h and
      # src/wasm/core.d.ts disagree.
      - run: npm test
      - run: npm run build
